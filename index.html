<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Save the date. Wedding details and mailing address collection.">
  <meta name="robots" content="noindex, nofollow">
  <title>Save the date</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23234468'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-size='24' fill='white'%3E%E2%99%A5%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=7">
  <script src="settings.js?v=4" defer></script>
  <script src="app.js?v=6" defer></script>
</head>
<body>
  <div class="envelope-scene" id="envelope-scene">
    <button class="envelope-open" id="open-invitation" type="button" aria-label="Open Julia and Luke's save the date">
      <span class="envelope" aria-hidden="true">
        <span class="envelope-letter">
          <span class="letter-kicker">Save the date</span>
          <strong>Julia &amp; Luke</strong>
          <span>June 26, 2027</span>
        </span>
        <span class="envelope-back"></span>
        <span class="envelope-flap"></span>
        <span class="envelope-front"></span>
        <span class="wax-seal">J <i>+</i> L</span>
      </span>
      <span class="open-prompt">Tap to open</span>
    </button>
  </div>

  <main id="invitation">
    <article class="invitation-card">
      <img class="couple-photo" src="assets/julia-and-luke.jpg" alt="Julia and Luke standing together at a celebration">
      <div class="photo-shade" aria-hidden="true"></div>
      <header class="invitation-header">
        <p class="save-title"><span>Save</span> <i>the</i> <span>Date</span></p>
        <div class="ornament" aria-hidden="true"></div>
        <div class="wedding-details">
          <h1 id="names">Your Name &amp; Your Partner</h1>
          <p class="date" id="date">Wedding date to come</p>
          <p id="location">City, State · Venue to come</p>
        </div>
      </header>
      <footer class="card-footer">Formal invitation to follow</footer>
    </article>
    <aside class="address-link" aria-label="Mailing address">
      <p id="form-pending">Mailing address link coming soon.</p>
      <a id="form-link" hidden target="_blank" rel="noopener noreferrer">Provide your mailing address</a>
      <p id="form-note" hidden>Opens Google Forms.</p>
      <div id="embed-container" hidden></div>
    </aside>
    <noscript><p class="notice">Please enable JavaScript to see the latest wedding details, calendar options, and address form.</p></noscript>
  </main>
</body>
</html>
